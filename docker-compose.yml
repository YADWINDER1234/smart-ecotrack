services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_ecotrack
    ports:
      - "5432:5432"
    volumes:
      - smart_ecotrack_pg:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/smart_ecotrack
      JWT_SECRET: dev_jwt_secret_change_me
      QR_SECRET: dev_qr_secret_change_me
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 60
    depends_on:
      - postgres
    ports:
      - "4000:4000"
    command: ["sh", "-c", "node dist/db/runMigrations.js && node dist/db/seeds/seed_data.js && node dist/index.js"]

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  smart_ecotrack_pg:

